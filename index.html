<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>강호촌 영주기</title>
<meta name="theme-color" content="#1c1411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="강호촌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/petitions.css">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/worldmap.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <header id="topbar">
    <div class="tb-name">
      <span class="seal" id="rank-seal" data-tip-title="村 · 마을 촌" data-tip="마을 등급">村</span>
      <div class="tb-title">
        <strong id="village-name">청석촌</strong>
        <small id="village-rank" data-tip-title="村">촌(村)</small>
      </div>
    </div>
    <div id="res" class="res"></div>
    <div class="clock">
      <div class="clock-text">
        <strong id="clock-date">1년 봄 1일</strong>
        <small id="clock-time" data-tip-title="진시 (辰時)" data-tip="옛 시각 12시진 가운데 하나. 지금으로 치면 아침 7~9시.">진시(辰時)</small>
      </div>
      <div class="speed" role="group" aria-label="게임 속도">
        <button type="button" id="spd-0" data-speed="0" title="일시정지 (Space)">❚❚</button>
        <button type="button" id="spd-1" data-speed="1" title="보통 (1)">▶</button>
        <button type="button" id="spd-2" data-speed="2" title="빠르게 (2)">▶▶</button>
        <button type="button" id="spd-4" data-speed="4" title="매우 빠르게 (3)">▶▶▶</button>
      </div>
    </div>
  </header>

  <nav id="menubar">
    <button type="button" id="btn-story" data-tip-title="총관(總管)" data-tip="영주를 곁에서 돕는 비서. 지금 할 일과 목표를 알려 준다.">총관</button>
    <button type="button" id="btn-admin" data-tip-title="육방(六房)" data-tip="관아의 여섯 부서. 예산을 나눠 주면 부서가 알아서 필요한 것을 짓고 처리한다.">육방</button>
    <button type="button" id="btn-petitions" data-tip-title="상소함(上疏函)" data-tip="백성이 올린 상소. 들어주거나 물리쳐 민심을 다스린다.">상소함 <span id="petition-badge" class="badge" hidden>0</span></button>
    <button type="button" id="btn-worldmap" class="wide-only" data-tip-title="天下圖 · 천하도" data-tip="천하의 판도와 전쟁, 계열마다의 세력 흐름을 본다. 보는 동안 시간이 멈춘다."><span class="mb-hj" aria-hidden="true">天下</span>천하도</button>
    <button type="button" id="btn-factions" data-tip-title="세력" data-tip="이웃과 천하의 세력, 외교, 의뢰, 강호의 소식.&#10;붉은 수는 맡을 수 있는 의뢰다.">세력 <span id="faction-badge" class="badge" hidden>0</span></button>
    <button type="button" id="btn-village">마을 현황</button>
    <button type="button" id="btn-log">기록</button>
    <button type="button" id="btn-save">저장</button>
    <button type="button" id="btn-help">도움말</button>
  </nav>

  <div id="banner" hidden></div>
  <div id="toasts" aria-live="polite"></div>

  <aside id="log" hidden>
    <div class="log-head">마을 기록 <button type="button" id="log-close" aria-label="닫기">✕</button></div>
    <ol id="log-list"></ol>
  </aside>

  <aside id="panel" hidden></aside>

  <div id="minimap-wrap"><canvas id="minimap" width="128" height="96"></canvas></div>

  <footer id="buildbar">
    <div id="build-tabs" class="build-tabs" role="tablist"></div>
    <div id="build-items" class="build-items"></div>
  </footer>

  <div id="tool-hint" hidden></div>
  <div id="tooltip" hidden></div>

  <div id="worldmap" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-inner">
      <button type="button" class="sheet-close" id="sheet-close" aria-label="닫기">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="scroll">
      <div class="scroll-rod"></div>
      <div class="scroll-paper">
        <div class="scroll-head">
          <span class="stamp" id="modal-stamp">事</span>
          <h2 id="modal-title">사건</h2>
        </div>
        <div id="modal-text" class="scroll-text"></div>
        <div id="modal-choices" class="choices"></div>
      </div>
      <div class="scroll-rod"></div>
    </div>
  </div>

  <div id="title-screen" class="title-screen">
    <canvas id="title-bg"></canvas>
    <div class="title-card">
      <div class="title-hanja" data-tip-title="江湖村領主記">江湖村領主記</div>
      <h1>강호촌 영주기</h1>
      <p class="title-lead">정파와 사파가 피를 흘리고, 녹림의 산적이 들끓는 난세.<br>지도에도 없는 작은 마을의 영주가 되어, 이 마을을 강호에 이름 높은 성(<span data-tip-title="城">城</span>)으로 키워내라.</p>
      <label class="title-field" for="input-name">마을 이름
        <input id="input-name" type="text" maxlength="8" autocomplete="off">
      </label>
      <div class="title-actions">
        <button type="button" id="btn-new" class="btn-primary">새로 시작</button>
        <button type="button" id="btn-continue" class="btn-ghost" hidden>이어하기</button>
      </div>
      <p class="title-note"><span class="for-mouse">좌클릭 선택·건설 · 드래그 이동 · 휠 확대 · Space 일시정지</span><span class="for-touch">누르기 선택·건설 · 끌기 이동 · 두 손가락 확대 · ❚❚ 일시정지</span></p>
    </div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/units.js"></script>
<script src="js/sim.js"></script>
<script src="js/events.js"></script>
<script src="js/jianghu.js"></script>
<script src="js/admin.js"></script>
<script src="js/petitions.js"></script>
<script src="js/story.js"></script>
<script src="js/tips.js"></script>
<script src="js/ui.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/main.js"></script>
</body>
</html>
